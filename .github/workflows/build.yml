name: Build README

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stats card
        env:
          # A personal access token (classic, "repo" scope) saved as the ACCESS_TOKEN secret.
          # The built-in token cannot see your private repos, so it is not used as a fallback:
          # the commit and line counts would silently drop.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update README stats" && git push)
